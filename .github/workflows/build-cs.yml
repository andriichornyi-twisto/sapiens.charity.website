name: Rebuild Czech pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - events/index.html
      - join/index.html
      - pets/index.html
      - support/index.html
      - build-cs.sh
      - scripts/build-pets.mjs

permissions:
  contents: write

jobs:
  build-cs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate cs/ pages
        run: |
          CHROME="$(command -v google-chrome || command -v chromium-browser)" ./build-cs.sh

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- cs/ pets/ sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cs/ pets/ sitemap.xml
            git commit -m "Rebuild generated pages (auto)"
            git push
          else
            echo "cs/ already up to date"
          fi
