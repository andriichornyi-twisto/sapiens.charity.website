<style>
  @font-face{
    font-family:'Archivo';font-style:normal;font-weight:500 900;font-display:swap;
    src:url('/fonts/archivo-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face{
    font-family:'Archivo';font-style:normal;font-weight:500 900;font-display:swap;
    src:url('/fonts/archivo-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root{
    --cream:#FFFAF4;--ochre:#DFA84F;--royal:#2B57C6;--wine:#55202E;--wine-deep:#471A26;
    --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:var(--font);background:var(--cream);color:var(--wine);
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;-webkit-font-smoothing:antialiased;
  }
  svg{width:clamp(90px,14vw,130px);height:auto;margin-bottom:28px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;opacity:.85;margin-bottom:18px;}
  h1{
    font-size:clamp(2.2rem,6vw,4.6rem);font-weight:800;letter-spacing:-.03em;
    line-height:1;text-transform:uppercase;max-width:18ch;text-wrap:balance;
  }
  h1 .hl{color:var(--ochre);}
  p{margin-top:22px;max-width:44ch;font-size:clamp(1rem,1.3vw,1.15rem);font-weight:600;line-height:1.55;opacity:.85;}
  .row{margin-top:38px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  a.btn{
    display:inline-flex;align-items:center;font-size:13px;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;text-decoration:none;border-radius:999px;padding:16px 28px;
    transition:transform .15s ease,background .2s ease;
  }
  a.btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--wine);color:var(--cream);}
  .btn-primary:hover{background:var(--wine-deep);}
  .btn-ghost{border:2px solid var(--wine);color:var(--wine);}
  .btn-ghost:hover{background:rgba(85,32,46,.06);}
  a:focus-visible{outline:3px solid var(--royal);outline-offset:3px;}
</style>
</head>
<body>

<svg viewBox="0 0 240 200" role="img" aria-label="Sapiens logo">
  <circle cx="64" cy="54" r="13" fill="#55202E"/>

  <circle cx="176" cy="54" r="13" fill="#9DB9E6"/>

</svg>

<span class="eyebrow">404</span>
<h1 data-i18n="h1">This page doesn&rsquo;t exist. <span class="hl">Kindness does.</span></h1>
<p data-i18n="p">The link may be old or mistyped &mdash; but you&rsquo;re very welcome here anyway.</p>
<div class="row">
  <a class="btn btn-primary" href="/" data-i18n="home">Back to the homepage</a>
  <a class="btn btn-ghost" href="/events/" data-i18n="events">See our events</a>
</div>

<script>
  (function(){
    const t={
      cs:{
        title:'Stránka nenalezena — Sapiens',
        h1:'Tahle stránka neexistuje. <span class="hl">Laskavost ano.</span>',
        p:'Odkaz je možná starý nebo s překlepem — ale i tak jste tu vítáni.',
        home:'Zpět na hlavní stránku',
        events:'Podívejte se na akce'
      }
    };
    let lang=null;
    try{lang=localStorage.getItem('sapiens-lang');}catch(e){}
    if(!lang) lang=(navigator.language||'').toLowerCase().startsWith('cs')?'cs':'en';
    if(t[lang]){
      document.documentElement.lang=lang;
      document.title=t[lang].title;
      document.querySelectorAll('[data-i18n]').forEach(el=>{
        const k=el.getAttribute('data-i18n');
        if(t[lang][k]) el.innerHTML=t[lang][k];
      });
    }
  })();
</script>
</body>
</html>
